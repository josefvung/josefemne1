<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Inventory</title>

  <style>
    /* ======= CSS (utseende) ======= */

    body {
      background-color: #19950b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 200px;
    }

    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background-color: #3a3a3a;
      color: white;
    }

    button:hover {
      background-color: #4a4a4a;
    }

    /* Minecraft-ish slots */
    #inventoryGrid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .slot {
      background-color: #8b8b8b;
      border-radius: 8px;
      padding: 6px;
      height: 110px;
      position: relative;
      box-shadow: inset 3px 3px 0 #f0f0f0, inset -3px -3px 0 #373737;
    }

    .slotInner {
      background-color: #c6c6c6;
      border-radius: 6px;
      height: 100%;
      padding: 8px;
      color: #111;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,.6), inset -2px -2px 0 rgba(0,0,0,.25);
    }

    .itemIcon {
      font-size: 26px;
      text-align: center;
      margin-top: 6px;
    }

    .itemName {
      font-size: 12px;
      text-align: center;
      margin-top: 6px;
      word-break: break-word;
    }

    .itemQty {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-weight: bold;
      color: black
    }
    

    .smallBtn {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 6px;
      width: 48%;
    }

    .editBtn { background-color: #b08b2b; }
    .deleteBtn { background-color: #b02b2b; }

    .editBtn:hover { background-color: #caa13a; }
    .deleteBtn:hover { background-color: #c23b3b; }

    #infoText {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>⛏️ Minecraft Inventory</h1>

    <p id="infoText">Legg til items og se dem dukke opp i inventoryen.</p>

    <!-- Input-rad -->
    <div class="row">
      <input id="itemName" type="text" placeholder="Item navn" />
      <input id="itemQty" type="number" placeholder="Antall" />
      <button onclick="addItem()">Legg til</button>
      <button onclick="toggleInventory()">Skjul inventory</button>
    </div>

    <!-- Inventory (det vi viser/skjuler) -->
    <div id="inventoryBox">
      <div id="inventoryGrid"></div>
    </div>
  </div>

  <script>
    // ======= JavaScript (funksjoner + variabler) =======

    // Vi lagrer items i en array
    let items = [];

    // Denne sier om inventory er skjult eller ikke
    let inventoryHidden = false;

    // Når nettsiden starter: hent fra localStorage
    loadFromStorage();
    showItems();

    function addItem() {
      // Hent input-verdier
      let name = document.getElementById("itemName").value;
      let qty = document.getElementById("itemQty").value;

      // Sjekk at brukeren har skrevet noe
      if (name === "" || qty === "") {
        document.getElementById("infoText").innerHTML = "Du må skrive inn både navn og antall!";
        return;
      }

      // Gjør qty til et tall
      qty = Number(qty);

      // Hvis item finnes fra før, øk antall
      let found = false;
      for (let i = 0; i < items.length; i++) {
        if (items[i].name.toLowerCase() === name.toLowerCase()) {
          items[i].qty = items[i].qty + qty;
          found = true;
        }
      }

      // Hvis ikke funnet, legg til nytt item
      if (found === false) {
        let newItem = {
          id: Date.now(),   // enkel id
          name: name,
          qty: qty
        };
        items.push(newItem);
      }

      // Lagre + oppdater visning
      saveToStorage();
      showItems();

      // Tøm inputfeltene
      document.getElementById("itemName").value = "";
      document.getElementById("itemQty").value = "";

      document.getElementById("infoText").innerHTML = "Item lagt til!";
    }

    function toggleInventory() {
      // Vi endrer inventoryHidden fra true/false
      inventoryHidden = !inventoryHidden;

      // Hent boksen vi vil skjule/vise
      let box = document.getElementById("inventoryBox");

      // Skjul eller vis med style.display
      if (inventoryHidden === true) {
        box.style.display = "none";
        // Endre tekst på knappen:
        // (denne knappen er den 2. i raden -> enklest å la infoText vise status)
        document.getElementById("infoText").innerHTML = "Inventory er skjult. Trykk 'Vis inventory' ved å trykke knappen igjen.";
      } else {
        box.style.display = "block";
        document.getElementById("infoText").innerHTML = "Inventory er synlig.";
      }

      // Vi oppdaterer også knappeteksten ved å finne alle knapper og velge den riktige
      // (en enkel løsning uten avansert JS)
      let buttons = document.getElementsByTagName("button");
      // buttons[1] er toggle-knappen i denne HTML-en
      if (inventoryHidden === true) {
        buttons[1].innerHTML = "Vis inventory";
      } else {
        buttons[1].innerHTML = "Skjul inventory";
      }
    }

    function showItems() {
      // Her bygger vi HTML som tekst, og putter inn med innerHTML
      let html = "";

      // Hvis ingen items:
      if (items.length === 0) {
        html = "<p>Ingen items enda.</p>";
        document.getElementById("inventoryGrid").innerHTML = html;
        return;
      }

      // Bygg slot for hvert item
      for (let i = 0; i < items.length; i++) {
        let icon = pickIcon(items[i].name);

        html += `
          <div class="slot">
            <div class="slotInner">
              <div class="itemIcon">${icon}</div>
              <div class="itemName">${items[i].name}</div>

              <button class="smallBtn editBtn" onclick="editItem(${items[i].id})">Rediger</button>
              <button class="smallBtn deleteBtn" onclick="deleteItem(${items[i].id})">Slett</button>
            </div>

            <div class="itemQty">${items[i].qty}</div>
          </div>
        `;
      }

      document.getElementById("inventoryGrid").innerHTML = html;
    }

    function editItem(id) {
      // Finn item
      for (let i = 0; i < items.length; i++) {
        if (items[i].id === id) {
          let newName = prompt("Nytt navn:", items[i].name);
          if (newName === null) return;

          let newQty = prompt("Nytt antall:", items[i].qty);
          if (newQty === null) return;

          if (newName === "" || newQty === "") {
            alert("Kan ikke være tomt!");
            return;
          }

          items[i].name = newName;
          items[i].qty = Number(newQty);

          saveToStorage();
          showItems();
          return;
        }
      }
    }

    function deleteItem(id) {
      // Lag en ny liste uten itemet (enkel måte)
      let newList = [];

      for (let i = 0; i < items.length; i++) {
        if (items[i].id !== id) {
          newList.push(items[i]);
        }
      }

      items = newList;

      saveToStorage();
      showItems();
    }

    function saveToStorage() {
      localStorage.setItem("mc_items_simple", JSON.stringify(items));
    }

    function loadFromStorage() {
      let data = localStorage.getItem("mc_items_simple");

      if (data !== null) {
        items = JSON.parse(data);
      }
    }

    function pickIcon(name) {
      let n = name.toLowerCase();

      if (n.includes("diamond")) return "💎";
      if (n.includes("stone")) return "🧱";
      if (n.includes("wood")) return "🪵";
      if (n.includes("bread")) return "🍞";
      if (n.includes("apple")) return "🍎";
      if (n.includes("sword")) return "⚔️";
      if (n.includes("pickaxe")) return "⛏️";

      return "📦";
    }
  </script>
</body>
</html>
